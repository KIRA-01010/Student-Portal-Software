{% extends "base.html" %}
{% block title %}Page not found · {{ app_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
  <div class="col-12 col-md-6">
    <i class="bi bi-compass display-1 text-body-tertiary"></i>
    <h1 class="h3 fw-bold mt-3">Page not found</h1>
    <p class="text-body-secondary">
      The page you are looking for does not exist or has been moved.
    </p>
    <a href="{{ url_for('home') }}" class="btn btn-primary mt-2">
      <i class="bi bi-house me-1"></i>Take me home
    </a>
  </div>
</div>
{% endblock %}
