{% extends "base.html" %}
{% block title %}Something went wrong · {{ app_name }}{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
  <div class="col-12 col-md-6">
    <i class="bi bi-cone-striped display-1 text-body-tertiary"></i>
    <h1 class="h3 fw-bold mt-3">Something went wrong</h1>
    <p class="text-body-secondary">
      We hit an unexpected problem. Please try again in a moment.
    </p>
    <a href="{{ url_for('home') }}" class="btn btn-primary mt-2">
      <i class="bi bi-arrow-clockwise me-1"></i>Back to safety
    </a>
  </div>
</div>
{% endblock %}
