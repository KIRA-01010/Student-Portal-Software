[pytest]
testpaths = tests
addopts = -q
# The Selenium markers are registered here as well as in selenium_tests/pytest.ini:
# VS Code discovers both folders from the project root, where only THIS file applies.
markers =
    registration: student / teacher sign-up
    login: sign-in behaviour
    validation: client-side and server-side form validation
    search: searching student records
    crud: add / update / delete student records
    logout: signing out
